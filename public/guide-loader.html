<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3eee4"><title>The Met × The Cloisters Guide</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3eee4;color:#17211e;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif}.box{width:min(520px,calc(100% - 32px));padding:28px;border:1px solid #d9d0c1;border-radius:22px;background:#fffdf8;box-shadow:0 14px 44px rgba(30,36,31,.1)}h1{margin:0 0 10px;font:500 2rem/1.05 Georgia,serif}p{margin:0;color:#68716c;line-height:1.65}.bar{height:8px;margin-top:20px;border-radius:99px;background:#e6dfd3;overflow:hidden}.bar:after{content:"";display:block;width:45%;height:100%;border-radius:99px;background:#203a32;animation:move 1s ease-in-out infinite alternate}@keyframes move{to{transform:translateX(120%)}}</style></head><body><main class="box"><h1>전시 가이드를 여는 중입니다</h1><p id="status">작품 이미지와 동선을 준비하고 있어요.</p><div class="bar" id="bar"></div></main><script>(async()=>{try{const r=await fetch('./guide.html.gz',{cache:'no-store'});if(!r.ok)throw new Error('가이드 파일을 불러오지 못했습니다');const bytes=new Uint8Array(await r.arrayBuffer());let html;if(bytes[0]===31&&bytes[1]===139){if(!('DecompressionStream'in window))throw new Error('Safari 또는 Chrome 최신 버전에서 열어 주세요.');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));html=await new Response(stream).text()}else html=new TextDecoder().decode(bytes);document.open();document.write(html);document.close()}catch(e){document.getElementById('bar').style.display='none';document.getElementById('status').textContent='페이지를 열지 못했습니다: '+(e.message||e)}})();</script></body></html>
