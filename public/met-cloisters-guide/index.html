<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f6f1e8">
  <title>부모님과 함께 보는 메트 × 클로이스터</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f1e8;color:#1d2321;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo","Segoe UI",sans-serif}.box{width:min(520px,calc(100% - 32px));padding:28px;border:1px solid #ddd4c5;border-radius:22px;background:#fffdf8;box-shadow:0 10px 32px rgba(28,31,26,.08)}h1{margin:0 0 10px;font:600 2rem/1.05 Georgia,"Times New Roman",serif}p{margin:0;color:#63706a;line-height:1.65}.bar{height:8px;margin-top:20px;border-radius:99px;background:#e6dfd3;overflow:hidden}.bar:after{content:"";display:block;width:45%;height:100%;border-radius:99px;background:#264a3f;animation:move 1.1s ease-in-out infinite alternate}@keyframes move{to{transform:translateX(120%)}}button{margin-top:18px;border:1px solid #ddd4c5;border-radius:999px;padding:9px 13px;background:#fffdf8;font:inherit;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main class="box">
    <h1>메트 가이드를 여는 중입니다</h1>
    <p id="status">작품 이미지와 설명을 준비하고 있어요.</p>
    <div class="bar" id="bar"></div>
  </main>
  <script>
    (async()=>{
      const status=document.getElementById('status');
      try{
        const response=await fetch('./guide.html.gz',{cache:'no-store'});
        if(!response.ok) throw new Error('가이드 파일을 불러오지 못했습니다 ('+response.status+')');
        const bytes=new Uint8Array(await response.arrayBuffer());
        let html;
        if(bytes[0]===31&&bytes[1]===139){
          if(!('DecompressionStream' in window)) throw new Error('이 브라우저에서는 압축 해제를 지원하지 않습니다. Safari 또는 Chrome 최신 버전에서 열어 주세요.');
          const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
          html=await new Response(stream).text();
        }else{
          html=new TextDecoder().decode(bytes);
        }
        const extraCss=`<style>
          .highlight-card{display:flex;flex-direction:column;height:100%}.highlight-image{height:230px;background:#ece4d6;overflow:hidden;position:relative}.highlight-image img{width:100%;height:100%;object-fit:cover;display:block}.highlight-image.portrait img{object-fit:contain;background:#e8e0d3}.highlight-credit{position:absolute;right:8px;bottom:8px;padding:4px 7px;border-radius:999px;background:rgba(20,26,23,.76);color:white;font-size:.65rem}.highlight-card .card-pad{flex:1}
        </style>`;
        html=html.replace('</head>',extraCss+'</head>');
        html=html.replace(/<section>\s*<div class="wrap">\s*<div class="helpbox">[\s\S]*?<\/section>\s*(?=<section>\s*<div class="wrap">\s*<h2>출처<\/h2>)/,'');
        const highlights=`<section>
          <div class="wrap">
            <h2>오디세이 외 메트 대표작</h2>
            <p class="lead">부모님이 “메트에서 제일 유명한 것들도 보고 싶다”고 하시면 아래 작품을 함께 보세요. 사진을 미리 확인하면 현장에서 훨씬 빨리 찾을 수 있습니다.</p>
            <div class="grid grid-3">
              <article class="card highlight-card"><div class="highlight-image"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d8/Temple_of_Dendur_-_Metropolitan_Museum.JPG/960px-Temple_of_Dendur_-_Metropolitan_Museum.JPG" alt="Temple of Dendur"><span class="highlight-credit">Wikimedia Commons · CC BY-SA</span></div><div class="card-pad"><div class="mini-title">Gallery 131</div><h3>Temple of Dendur</h3><p class="small">메트의 상징과 같은 고대 이집트 신전입니다. 유리창과 수면, 사암 신전이 만드는 공간 전체를 보세요.</p><div class="linkrow"><a href="https://www.metmuseum.org/art/collection/search/547802" target="_blank" rel="noopener">공식 작품 페이지</a></div></div></article>
              <article class="card highlight-card"><div class="highlight-image"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/95/Washington_Crossing_the_Delaware_by_Emanuel_Leutze%2C_MMA-NYC%2C_1851.jpg/960px-Washington_Crossing_the_Delaware_by_Emanuel_Leutze%2C_MMA-NYC%2C_1851.jpg" alt="Washington Crossing the Delaware"><span class="highlight-credit">The Met · Public Domain</span></div><div class="card-pad"><div class="mini-title">Gallery 760</div><h3>Washington Crossing the Delaware</h3><p class="small">실제 크기가 압도적인 미국 역사화입니다. 배와 인물들이 만드는 강한 대각선 구도가 핵심입니다.</p><div class="linkrow"><a href="https://www.metmuseum.org/art/collection/search/11417" target="_blank" rel="noopener">공식 작품 페이지</a></div></div></article>
              <article class="card highlight-card"><div class="highlight-image portrait"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/01/Johannes_Vermeer_%28Dutch%2C_Delft_1632%E2%80%931675_Delft%29_-_Young_Woman_with_a_Water_Pitcher_-_Google_Art_Project.jpg/960px-Johannes_Vermeer_%28Dutch%2C_Delft_1632%E2%80%931675_Delft%29_-_Young_Woman_with_a_Water_Pitcher_-_Google_Art_Project.jpg" alt="Young Woman with a Water Pitcher"><span class="highlight-credit">Public Domain</span></div><div class="card-pad"><div class="mini-title">Gallery 614</div><h3>Vermeer — Young Woman with a Water Pitcher</h3><p class="small">창문에서 들어오는 부드러운 빛과 파란색·흰색의 균형을 보세요. 베르메르 특유의 조용한 순간입니다.</p><div class="linkrow"><a href="https://www.metmuseum.org/art/collection/search/437881" target="_blank" rel="noopener">공식 작품 페이지</a></div></div></article>
              <article class="card highlight-card"><div class="highlight-image portrait"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/7b/Bridge_over_a_Pond_of_Water_Lilies_by_Claude_Monet_%281899%29.jpg/960px-Bridge_over_a_Pond_of_Water_Lilies_by_Claude_Monet_%281899%29.jpg" alt="Bridge over a Pond of Water Lilies"><span class="highlight-credit">Public Domain</span></div><div class="card-pad"><div class="mini-title">Gallery 819</div><h3>Monet — Bridge over a Pond of Water Lilies</h3><p class="small">일본식 다리와 수련 연못이 하나의 색면처럼 이어집니다. 클로이스터 정원과도 좋은 여운을 만듭니다.</p><div class="linkrow"><a href="https://www.metmuseum.org/art/collection/search/437127" target="_blank" rel="noopener">공식 작품 페이지</a></div></div></article>
              <article class="card highlight-card"><div class="highlight-image portrait"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a8/Van_Gogh_Self-Portrait_with_Straw_Hat_1887-Metropolitan.jpg/960px-Van_Gogh_Self-Portrait_with_Straw_Hat_1887-Metropolitan.jpg" alt="Self-Portrait with a Straw Hat"><span class="highlight-credit">Public Domain</span></div><div class="card-pad"><div class="mini-title">Gallery 825</div><h3>Van Gogh — Self-Portrait with a Straw Hat</h3><p class="small">노란 모자와 짧고 방향성 강한 붓질을 가까이에서 보세요. 짧고 강렬한 마지막 작품으로 좋습니다.</p><div class="linkrow"><a href="https://www.metmuseum.org/art/collection/search/436532" target="_blank" rel="noopener">공식 작품 페이지</a></div></div></article>
              <article class="card highlight-card"><div class="highlight-image portrait"><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/VII._The_Unicorn_Rest_in_a_Garden.png?width=960" alt="The Unicorn Rests in a Garden"><span class="highlight-credit">The Met · Public Domain</span></div><div class="card-pad"><div class="mini-title">The Cloisters · Gallery 17</div><h3>The Unicorn Rests in a Garden</h3><p class="small">울타리 안의 유니콘, 석류나무, 붉은 얼룩을 보세요. 클로이스터를 대표하는 신비로운 태피스트리입니다.</p><div class="linkrow"><a href="https://www.metmuseum.org/art/collection/search/467642" target="_blank" rel="noopener">공식 작품 페이지</a></div></div></article>
            </div>
          </div>
        </section>`;
        html=html.replace(/<section>\s*<div class="wrap">\s*<h2>오디세이 외 메트 대표작<\/h2>[\s\S]*?<\/section>\s*(?=<section>\s*<div class="wrap">\s*<h2>출처<\/h2>)/,highlights+'\n');
        document.open();document.write(html);document.close();
      }catch(error){
        document.getElementById('bar').style.display='none';
        status.innerHTML='<strong>페이지를 열지 못했습니다.</strong><br>'+String(error.message||error)+'<br><button onclick="location.reload()">다시 시도</button>';
      }
    })();
  </script>
</body>
</html>
