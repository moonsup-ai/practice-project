<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4efe5"><title>부모님과 함께 보는 메트 × 클로이스터</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4efe5;color:#17221e;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif}.box{width:min(520px,calc(100% - 32px));padding:28px;border:1px solid #ddd3c3;border-radius:22px;background:#fffdf7;box-shadow:0 10px 32px rgba(28,31,26,.08)}h1{margin:0 0 10px;font:500 2rem/1.05 Georgia,serif}p{margin:0;color:#6c746f;line-height:1.65}.bar{height:8px;margin-top:20px;border-radius:99px;background:#e6dfd3;overflow:hidden}.bar:after{content:"";display:block;width:45%;height:100%;border-radius:99px;background:#1f3a31;animation:move 1.1s ease-in-out infinite alternate}@keyframes move{to{transform:translateX(120%)}}</style></head><body><main class="box"><h1>전시 가이드를 여는 중입니다</h1><p id="status">작품 이미지와 동선을 준비하고 있어요.</p><div class="bar" id="bar"></div></main><script>(async()=>{try{const [gz,archiveResponse,...parts]=await Promise.all([fetch('./guide.html.gz',{cache:'no-store'}),fetch('./archive.json',{cache:'no-store'}),...Array.from({length:6},(_,i)=>fetch('./template-'+i+'.txt',{cache:'no-store'}))]);if(!gz.ok||!archiveResponse.ok||parts.some(r=>!r.ok))throw new Error('가이드 파일을 불러오지 못했습니다');const bytes=new Uint8Array(await gz.arrayBuffer());let source;if(bytes[0]===31&&bytes[1]===139){if(!('DecompressionStream'in window))throw new Error('Safari 또는 Chrome 최신 버전에서 열어 주세요.');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));source=await new Response(stream).text()}else source=new TextDecoder().decode(bytes);const doc=new DOMParser().parseFromString(source,'text/html');const imgs=[...doc.querySelectorAll('article.work-card img')].map(x=>x.src);let page=(await Promise.all(parts.map(r=>r.text()))).join('');imgs.forEach((src,i)=>page=page.replace('__ODYSSEY_IMG_'+i+'__',src));const archive=await archiveResponse.json();const objectData=async id=>{try{const r=await fetch('https://collectionapi.metmuseum.org/public/collection/v1/objects/'+id);if(!r.ok)return null;return await r.json()}catch{return null}};const resolve=async item=>{try{if(item.id){const o=await objectData(item.id);return o?{...item,...o}:null}const s=await fetch('https://collectionapi.metmuseum.org/public/collection/v1/search?hasImages=true&q='+encodeURIComponent(item.q));const sj=await s.json();for(const id of (sj.objectIDs||[]).slice(0,12)){const o=await objectData(id);if(o&&(o.primaryImageSmall||o.primaryImage||(o.additionalImages&&o.additionalImages[0])))return{...item,...o}}return null}catch{return null}};const objects=(await Promise.all(archive.map(resolve))).filter(Boolean);const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const cards=objects.map(o=>{const image=o.primaryImageSmall||o.primaryImage||(o.additionalImages&&o.additionalImages[0])||'';const location=o.GalleryNumber?'Gallery '+o.GalleryNumber:(o.isPublicDomain?'현재 비전시':'위치 확인 필요');return`<a class="archive-card reveal" href="${esc(o.objectURL)}" target="_blank" rel="noopener"><div class="archive-thumb"><div class="archive-empty"><i>THE MET</i><small>공개 이미지를 불러올 수 없습니다</small></div>${image?`<img loading="lazy" src="${esc(image)}" alt="${esc(o.title)}" onerror="this.parentElement.classList.add('image-failed');this.remove()">`:''}<span>${esc(location)}</span></div><div class="archive-copy"><h3>${esc(o.title)}</h3><p class="archive-artist">${esc(o.artistDisplayName||o.culture||'The Met Collection')}</p><p class="archive-desc">${esc(o.note)}</p></div></a>`}).join('');const archiveSection=`<section id="archive"><div class="wrap"><div class="eyebrow">More to discover</div><h2>시간 때문에 소개하지 못한<br>작품 아카이브</h2><p class="lead">이번 압축 동선에서는 제외했지만, 시간이 더 있거나 다음 방문을 계획할 때 볼 만한 작품들입니다. 각 카드에 현재 공개된 갤러리 번호와 짧은 작품 이야기를 함께 적었습니다.</p><div class="archive-grid">${cards}</div><p class="archive-note">※ 전시 위치는 교체될 수 있으므로 방문 당일 작품을 눌러 공식 페이지에서 다시 확인하세요.</p></div></section>`;const archiveCss=`<style>.archive-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:30px}.archive-card{text-decoration:none;background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden;transition:.25s transform,.25s box-shadow;display:flex;flex-direction:column}.archive-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}.archive-thumb{height:190px;background:#e8e0d3;position:relative;overflow:hidden}.archive-thumb img{position:relative;z-index:2;width:100%;height:100%;object-fit:cover}.archive-thumb span{position:absolute;z-index:3;left:9px;bottom:9px;padding:5px 8px;border-radius:999px;background:rgba(23,34,30,.84);color:#fff;font-size:.68rem;font-weight:900}.archive-empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:7px;color:#7d8882;background:linear-gradient(145deg,#eee7da,#ddd3c2)}.archive-empty i{font:700 .75rem/1 monospace;letter-spacing:.16em}.archive-empty small{font-size:.67rem}.archive-copy{padding:14px;display:flex;flex-direction:column;flex:1}.archive-copy h3{font-family:Georgia,serif;font-size:1.08rem;line-height:1.12;margin:0 0 7px;color:var(--ink)}.archive-artist{font-size:.75rem!important;color:var(--muted)!important;margin:0 0 10px!important}.archive-desc{font-size:.79rem!important;line-height:1.55!important;color:var(--green)!important;margin:0!important}.archive-note{margin-top:16px;color:var(--muted);font-size:.82rem}@media(max-width:900px){.archive-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:600px){.archive-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.archive-thumb{height:150px}.archive-copy{padding:12px}.archive-copy h3{font-size:.95rem}.archive-desc{font-size:.73rem!important}}</style>`;page=page.replace('</head>',archiveCss+'</head>');page=page.replace('<section class="dark"><div class="wrap"><div class="eyebrow" style="color:#dbc38f">On-site notes</div>',archiveSection+'<section class="dark"><div class="wrap"><div class="eyebrow" style="color:#dbc38f">On-site notes</div>');document.open();document.write(page);document.close()}catch(e){document.getElementById('bar').style.display='none';document.getElementById('status').textContent='페이지를 열지 못했습니다: '+(e.message||e)}})();</script></body></html>
